name: CI

# lint → type check → unit tests → integration tests → frontend build → Docker build → full-stack E2E.
# Nothing is deployed anywhere: there is no production target configured.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minipaas
          POSTGRES_PASSWORD: minipaas
          POSTGRES_DB: minipaas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minipaas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://minipaas:minipaas@127.0.0.1:5432/minipaas_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests alembic
          black --check app tests alembic
      - name: Type check
        run: mypy app tests
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (PostgreSQL + Redis)
        run: pytest tests/integration -q
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+asyncpg://minipaas:minipaas@127.0.0.1:5432/minipaas_test
        run: alembic upgrade head && alembic check

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  stack:
    name: Docker build + full-stack E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          # E2E registers several users from one IP; production defaults stay strict.
          echo "RATE_LIMIT_REGISTER=100/60" >> .env
          echo "RATE_LIMIT_LOGIN=100/60" >> .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start the platform
        run: docker compose up -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/ready >/dev/null; then echo "ready"; exit 0; fi
            sleep 3
          done
          docker compose ps
          exit 1
      - name: Smoke test
        run: |
          curl -fsS http://localhost/health
          curl -fsS http://localhost/ | grep -q "<div id=\"root\">"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://nothing-here.localhost/)" = "503"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npm run typecheck && npx playwright install --with-deps chromium
      - name: End-to-end tests (real Docker deployments)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost
          E2E_DOCKER: "1"
        run: npx playwright test
      - name: Seed works against the running stack
        run: docker compose exec -T backend python -m app.cli.seed --no-deploy
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Tear down
        if: always()
        run: docker compose down -v
