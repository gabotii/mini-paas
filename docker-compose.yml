# Mini PaaS — complete local environment.
#
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost
#
# Secrets (JWT, encryption keys, DB password, internal token) are generated once per
# installation by `secrets-init` into the `paas-secrets` volume. Values set in .env win.

name: mini-paas

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  logging: *logging

# Backend services also read .env (optional), so any setting from backend/app/core/config.py
# (rate limits, quotas, retention...) can be tuned there. Explicit `environment` keys win.
x-env-file: &env-file
  env_file:
    - path: .env
      required: false

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRETS_DIR: /run/paas-secrets
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-minipaas}
  POSTGRES_DB: ${POSTGRES_DB:-minipaas}
  REDIS_URL: redis://redis:6379/0
  # Optional overrides; empty means "use the generated secret file".
  JWT_SECRET: ${JWT_SECRET:-}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
  PLATFORM_HOST: ${PLATFORM_HOST:-localhost}
  APPS_BASE_DOMAIN: ${APPS_BASE_DOMAIN:-localhost}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
  PUBLIC_PORT: ${PUBLIC_PORT:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DATA_DIR: /data
  PROXY_CONTAINER_NAME: paas-proxy
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}

x-api-image: &api-image
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: api
  image: mini-paas-backend:latest

x-worker-image: &worker-image
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: worker
  image: mini-paas-worker:latest

services:
  # ------------------------------------------------------------------ edge
  proxy:
    image: traefik:v3.5
    container_name: paas-proxy   # fixed: the worker attaches it to project networks by name
    <<: *hardening
    entrypoint: ["/bin/sh", "/etc/traefik/entrypoint.sh"]
    environment:
      PLATFORM_HOST: ${PLATFORM_HOST:-localhost}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./infrastructure/traefik/entrypoint.sh:/etc/traefik/entrypoint.sh:ro
      - paas-secrets:/run/paas-secrets:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    <<: *hardening
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    restart: unless-stopped

  # ------------------------------------------------------------------ platform
  secrets-init:
    <<: [*hardening, *api-image]
    user: "0:0"   # needs to chown the generated files
    command: ["python", "-m", "app.cli.init_secrets", "/run/paas-secrets"]
    volumes:
      - paas-secrets:/run/paas-secrets
    network_mode: none
    restart: "no"

  migrate:
    <<: [*hardening, *api-image, *env-file]
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    volumes:
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: [*hardening, *api-image, *env-file]
    environment: *backend-env
    volumes:
      - paas-data:/data
      - paas-secrets:/run/paas-secrets:ro
    networks: [edge, internal]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  worker:
    <<: [*hardening, *worker-image, *env-file]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel", "INFO",
              "-Q", "deployments", "--concurrency", "2", "--prefetch-multiplier", "1",
              "--hostname", "deployments@%h"]
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - paas-data:/data
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal, egress]   # egress: git clone of public repositories
    stop_grace_period: 2m          # let in-flight steps finish (warm shutdown)
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  ops-worker:
    <<: [*hardening, *worker-image, *env-file]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel", "INFO",
              "-Q", "ops,maintenance", "--concurrency", "2", "--prefetch-multiplier", "1",
              "--hostname", "ops@%h"]
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - paas-data:/data
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal]
    stop_grace_period: 1m
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  scheduler:
    <<: [*hardening, *api-image, *env-file]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    volumes:
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    <<: [*hardening, *worker-image, *env-file]
    command: ["python", "-m", "app.agent"]
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal]
    stop_grace_period: 20s
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:17-alpine
    <<: *hardening
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minipaas}
      POSTGRES_DB: ${POSTGRES_DB:-minipaas}
      POSTGRES_PASSWORD_FILE: /run/paas-secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - paas-secrets:/run/paas-secrets:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *hardening
    # noeviction: Celery messages must never be silently evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  edge: {}                  # proxy, frontend, API
  internal:
    internal: true          # no route to the outside world: data stores and workers
  egress: {}                # outbound access for git clones
  # Per-project app networks (paas-net-<project id>) are created at runtime by the worker.

volumes:
  postgres-data:
  redis-data:
  paas-data:
  paas-secrets:
